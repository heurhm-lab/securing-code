<title>Low Battery Campaign Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Header carries the campaign's overall "charge"; a tab bar switches between
   working surfaces (story map, threads, workflow, voice, strategy); any piece opens in a right-hand drawer. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E7EDEB; --ink:#132120; --muted:#55686A; --line:#D3DDDA;
  --accent:#0D6E64; --accent-ink:#FFFFFF; --accent-soft:#D3ECE8;
  --low:#C8402B; --low-soft:#FADFD8; --mid:#A86B12; --mid-soft:#F5E6C8; --ok:#2E7D4F; --ok-soft:#D9EEE0;
  --ch-tt:#B02C78; --ch-ig:#B45309; --ch-yt:#B91C1C; --ch-em:#2557B0; --ch-app:#0D6E64; --ch-cr:#6538C2;
  --shadow:0 1px 2px rgba(19,33,32,.06),0 10px 28px rgba(19,33,32,.10);
  --scrim:rgba(19,33,32,.35);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#162120; --sunk:#1D2A29; --ink:#E4EEEC; --muted:#93A8A5; --line:#2A3A38;
    --accent:#4CC2B4; --accent-ink:#06201D; --accent-soft:#16403B;
    --low:#FF7B66; --low-soft:#47211B; --mid:#E9B25A; --mid-soft:#3E3018; --ok:#6FCF97; --ok-soft:#173A27;
    --ch-tt:#F06AB8; --ch-ig:#F59E4B; --ch-yt:#F87171; --ch-em:#7AA7F5; --ch-app:#4CC2B4; --ch-cr:#A88BF5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --sunk:#1D2A29; --ink:#E4EEEC; --muted:#93A8A5; --line:#2A3A38;
  --accent:#4CC2B4; --accent-ink:#06201D; --accent-soft:#16403B;
  --low:#FF7B66; --low-soft:#47211B; --mid:#E9B25A; --mid-soft:#3E3018; --ok:#6FCF97; --ok-soft:#173A27;
  --ch-tt:#F06AB8; --ch-ig:#F59E4B; --ch-yt:#F87171; --ch-em:#7AA7F5; --ch-app:#4CC2B4; --ch-cr:#A88BF5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px}
@media (max-width:600px){.wrap{padding-inline:16px}}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.brand h1 b{color:var(--low);font-weight:800}
.brand p{color:var(--muted);font-size:13px}
.charge{display:flex;align-items:center;gap:12px}
.charge .big{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bigbatt{position:relative;width:72px;height:32px;border:2.5px solid var(--ink);border-radius:7px;padding:3px}
.bigbatt::after{content:"";position:absolute;right:-7px;top:9px;width:4px;height:9px;background:var(--ink);border-radius:0 2px 2px 0}
.bigbatt span{display:block;height:100%;border-radius:3px;background:var(--low);transition:width .4s}
.charge .lbl{font-size:12px;color:var(--muted);line-height:1.3}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
main .wrap{padding-block:22px 48px;display:grid;gap:20px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:20px}
.panel h3{font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
select,input[type="date"],input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical}
label.field{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chdot{width:9px;height:9px;border-radius:50%;background:var(--ch);flex:none}

/* stage pills + mini battery */
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill[data-s="draft"]{background:var(--low-soft);color:var(--low)}
.pill[data-s="edit"],.pill[data-s="review"]{background:var(--mid-soft);color:var(--mid)}
.pill[data-s="approved"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-s="live"]{background:var(--accent);color:var(--accent-ink)}
.pill.late{background:var(--low);color:var(--surface)}
.batt{display:inline-flex;gap:2px;padding:2px;border:1.5px solid var(--muted);border-radius:4px;position:relative;vertical-align:middle}
.batt::after{content:"";position:absolute;right:-4px;top:4px;width:2px;height:5px;background:var(--muted);border-radius:0 1px 1px 0}
.batt i{width:5px;height:9px;border-radius:1px;background:var(--sunk)}
.batt[data-l="1"] i:nth-child(-n+1),.batt[data-l="2"] i:nth-child(-n+2){background:var(--low)}
.batt[data-l="3"] i:nth-child(-n+3),.batt[data-l="4"] i:nth-child(-n+4){background:var(--mid)}
.batt[data-l="5"] i{background:var(--accent)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:var(--low)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.toolbar .row{align-items:end}

/* story map */
.scroll-x{overflow-x:auto;min-width:0}
table.map{border-collapse:separate;border-spacing:6px;width:100%;min-width:1080px;table-layout:fixed;margin:-6px}
table.map th{text-align:left;vertical-align:top;font-weight:400}
table.map thead th{padding:6px 8px 8px}
table.map thead th .n{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
table.map thead th .r{font-size:12px;color:var(--muted)}
.prog{height:4px;background:var(--sunk);border-radius:2px;margin-top:6px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ch,var(--accent))}
table.map tbody th{width:190px;padding:10px 10px 10px 4px}
.beat .wk{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.beat h3{font-size:20px;margin:2px 0 4px;letter-spacing:-.01em}
.beat p{font-size:12.5px;color:var(--muted);line-height:1.4}
.cell{width:100%;height:100%;min-height:138px;text-align:left;display:flex;flex-direction:column;gap:6px;padding:10px 11px 10px 13px;background:var(--surface);border:1px solid var(--line);border-radius:9px;cursor:pointer;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ch)}
.cell:hover{border-color:var(--ch);box-shadow:var(--shadow)}
.cell .t{font-weight:700;font-size:14px;line-height:1.3}
.cell .m{font-size:12px;color:var(--muted);margin-top:auto}
.cell .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.threads{display:flex;flex-wrap:wrap;gap:4px}
.th{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.th b{color:var(--ink);font-weight:500}
.dim{opacity:.28}
td.map-td{vertical-align:top;height:1px}

/* threads view */
.tlane{display:grid;grid-template-columns:230px repeat(6,minmax(130px,1fr));gap:6px;min-width:1050px}
.tlane .head{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
.tlane .name{padding:10px 8px 10px 0}
.tlane .name h3{font-size:17px}
.tlane .name p{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px}
.tlane .slot{background:var(--sunk);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:64px}
.step{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px}
.step:hover{border-color:var(--ch)}
.step .s1{display:flex;align-items:center;gap:6px;font-weight:700}
.role{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.warnlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.warnlist li{border-left:3px solid var(--low);background:var(--low-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px}
.oklist li{border-left-color:var(--ok);background:var(--ok-soft)}

/* workflow */
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;min-width:1240px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col header{display:grid;gap:1px;padding:2px 4px 6px}
.col header b{font-family:var(--f-display);font-size:15px;display:flex;justify-content:space-between}
.col header span{font-size:12px;color:var(--muted)}
.who{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 5px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.who.ai{color:var(--ch-cr);border-color:var(--ch-cr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:5px;font-size:13px;position:relative}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--ch)}
.card .t{font-weight:700;line-height:1.3;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.card .t:hover{text-decoration:underline}
.card .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .mv{display:flex;gap:4px}
.card .why{font-size:11.5px;color:var(--low)}
.cap{display:grid;gap:14px}
.caprow{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center}
@media (max-width:640px){.caprow{grid-template-columns:1fr}}
.capname b{display:block}
.capname span{font-size:12px;color:var(--muted)}
.bars{position:relative;display:grid;gap:4px;padding-block:2px}
.bar{height:16px;border-radius:4px;background:var(--sunk);position:relative;overflow:visible}
.bar span{display:block;height:100%;border-radius:4px}
.bar.manual span{background:var(--muted);opacity:.55}
.bar.ai span{background:var(--accent)}
.bar.over span{background:var(--low);opacity:1}
.capline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.capline::after{content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* voice */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.persona{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.pillars{display:grid;gap:12px;margin-top:14px}
.pillar{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.pillar h3{font-size:16px}
.saynot{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px}
@media (max-width:500px){.saynot{grid-template-columns:1fr}}
.say,.not{border-radius:8px;padding:8px 10px}
.say{background:var(--ok-soft)}
.not{background:var(--low-soft)}
.say b,.not b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.say b{color:var(--ok)} .not b{color:var(--low)}
.swap{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin-top:8px}
.swap s{color:var(--low)}
table.plain{border-collapse:collapse;width:100%;font-size:13.5px}
table.plain th,table.plain td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dial{display:inline-flex;gap:2px;vertical-align:middle}
.dial i{width:7px;height:7px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dial i.on{background:var(--ink);border-color:var(--ink)}

/* lint results */
.score{display:flex;align-items:center;gap:12px}
.score .num{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score .num.good{color:var(--ok)} .score .num.meh{color:var(--mid)} .score .num.bad{color:var(--low)}
.issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.issues li{font-size:13.5px;padding:7px 10px;border-radius:7px;background:var(--sunk);display:grid;gap:2px}
.issues li .sev{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.issues li[data-sev="critical"]{background:var(--low-soft)} .issues li[data-sev="critical"] .sev{color:var(--low)}
.issues li[data-sev="warn"]{background:var(--mid-soft)} .issues li[data-sev="warn"] .sev{color:var(--mid)}
.issues li[data-sev="tip"] .sev{color:var(--muted)}
.issues q{font-style:italic}
.aibox{border:1px dashed var(--ch-cr);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:8px}
.aibox .eyebrow{color:var(--ch-cr)}
.ai-off{font-size:13px;color:var(--muted)}

/* strategy */
.bigidea{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.bigidea{grid-template-columns:1fr}}
.bigidea h2{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.025em;line-height:1.05}
.bigidea .lede{font-size:17px;margin-top:12px;max-width:62ch}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;align-content:start}
.person h3{font-size:19px}
.person .lvl{font-family:var(--f-mono);font-size:12px;color:var(--low)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow .node{flex:1 1 150px;border:1px solid var(--line);border-top:4px solid var(--ch);border-radius:8px;padding:10px 12px;display:grid;gap:3px;align-content:start;background:var(--surface)}
.flow .node b{font-family:var(--f-display);font-size:15px}
.flow .node span{font-size:12.5px;color:var(--muted)}
.flow .arr{align-self:center;color:var(--muted);font-family:var(--f-mono)}
.prose{max-width:70ch;display:grid;gap:10px}
.prose ul{margin:0;padding-left:20px;display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;display:grid;gap:8px;position:relative}
.dhead::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--ch)}
.dhead h2{font-size:22px;padding-right:40px}
.dclose{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.dbody{overflow-y:auto;padding:16px 18px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.dsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.dsec > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.dsec h3{font-size:16px}
.brief{font-family:var(--f-mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px;max-height:360px;overflow:auto;margin:0}
.gate{font-size:13px;color:var(--muted)}
.gate.block{color:var(--low)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.hint{font-size:12.5px;color:var(--muted)}

.foot{border-top:1px solid var(--line)}
.foot .wrap{padding-block:14px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync[data-k="db"]::before{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">

        <h1>Low Battery <b>2%</b></h1>

function today(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function launchDate(){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(state.settings.launch || DEFAULT_LAUNCH) || /^(\d{4})-(\d{2})-(\d{2})$/.exec(DEFAULT_LAUNCH);
  return new Date(+m[1], +m[2]-1, +m[3]);
}
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const publishDate = p => addDays(launchDate(), (p.wk-1)*7 + CH[p.ch].day);
const dueDate = p => addDays(publishDate(p), -CH[p.ch].leadDays);

function ps(id){
  const p = PIECE[id];
  return Object.assign({status:"brief", owner:CH[p.ch].owner, draft:"", notes:"", safetyOk:false}, state.pieces[id] || {});
}
const stageIdx = id => STAGE_IDX[ps(id).status] ?? 0;
const isLate = id => stageIdx(id) < STAGE_IDX.approved && dueDate(PIECE[id]) < today();
const label = p => `W${p.wk} ${CH[p.ch].name}`;

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3200);
}
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const pre = btn?.closest(".dsec, .panel")?.querySelector(".brief, textarea");
    if (pre){ const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Couldn't copy automatically. The text is selected; press Ctrl+C or ⌘C."); }
}
const batt = lvl => `<span class="batt" data-l="${lvl}" aria-hidden="true">${"<i></i>".repeat(5)}</span>`;
function pill(id){
  const s = ps(id);
  if (isLate(id)) return `<span class="pill late">Overdue · ${esc(STAGES[stageIdx(id)].name)}</span>`;
  return `<span class="pill" data-s="${s.status}">${esc(STAGES[stageIdx(id)].name)}</span>`;
}

/* ============================================================
   VOICE CHECK (runs locally, no AI needed)
   ============================================================ */
function lintVoice(text, chId){
  const c = CH[chId] || CH.tt, issues = [], t = text || "";
  if (!t.trim()) return {score:null, issues:[], critical:0};
  const add = (sev, msg, quote) => issues.push({sev, msg, quote});
  for (const a of AVOID){
    const found = [...new Set((t.match(a.re) || []).map(s => s.trim()))];
    for (const q of found) add(a.sev, `${a.why} Try: ${a.use}.`, q);
  }
  for (const q of new Set(t.match(RE_IMPERATIVE) || [])) add("warn", "Instructs instead of inviting. Try \"you could\" or \"if you want\".", q);
  for (const q of new Set(t.match(RE_PROMISE) || [])) add("critical", "Promises an outcome. Tend supports; it doesn't guarantee results.", q);
  for (const q of new Set(t.match(RE_URGENCY) || [])) add("warn", "Urgency or streak shame. Missing a day is fine.", q);
  if (RE_CRISIS.test(t) && !RE_CRISIS_LINE.test(t)) add("critical", "Touches crisis or self-harm without a crisis resource. Add the 988 line (or local equivalent) and route to the clinical advisor.", (t.match(RE_CRISIS)||[""])[0]);
  if (chId === "cr" && !RE_DISCLOSE.test(t)) add("critical", "Creator content must carry a disclosure: #ad or the Paid partnership label.", "");
  const emoji = (t.match(RE_EMOJI) || []).length;
  if (emoji > c.limits.emoji) add("warn", `${emoji} emoji. ${c.name} allows up to ${c.limits.emoji}.`, "");
  const tags = (t.match(RE_HASHTAG) || []).length;
  if (tags > c.limits.hashtags) add("warn", `${tags} hashtags. ${c.name} allows up to ${c.limits.hashtags}.`, "");
  const bangs = (t.match(/!/g) || []).length;
  if (bangs > c.limits.bangs) add("warn", `${bangs} exclamation marks. ${c.name} allows ${c.limits.bangs}. Calm reads as caring.`, "");
  const prose = t.split("\n").filter(l => /[a-z]/.test(l)).join("\n");   // skip all-caps section labels
  const caps = (prose.match(/\b[A-Z]{4,}\b/g) || []).filter(w => !["TIKTOK","POV","YOUTUBE","CTA","ASMR"].includes(w));
  if (caps.length) add("tip", "All-caps words read as shouting.", caps.slice(0,3).join(", "));
  const sentences = t.split(/(?<=[.!?])\s+|\n+/).map(s => s.trim()).filter(s => s.split(/\s+/).length > 2);
  const longOnes = sentences.filter(s => s.split(/\s+/).length > c.limits.words * 1.6);
  if (longOnes.length) add("tip", `${longOnes.length} sentence${longOnes.length>1?"s":""} well over the ${c.limits.words}-word target for ${c.name}.`, longOnes[0].slice(0,80) + (longOnes[0].length>80?"…":""));
  const pen = {critical:25, warn:8, tip:3};
  const score = Math.max(0, 100 - issues.reduce((s,i) => s + pen[i.sev], 0));
  const order = {critical:0, warn:1, tip:2};
  issues.sort((a,b) => order[a.sev] - order[b.sev]);
  return {score, issues, critical:issues.filter(i => i.sev === "critical").length};
}
function lintHTML(r){
  if (r.score == null) return `<p class="hint">Write or paste a draft to see its voice score.</p>`;
  const cls = r.score >= 85 ? "good" : r.score >= 70 ? "meh" : "bad";
  const verdict = r.critical ? "Blocked: fix the critical issues before approval." : r.score >= 85 ? "On voice." : r.score >= 70 ? "Close. Clear the warnings if you can." : "Off voice. Needs another pass.";
  return `<div class="score"><span class="num ${cls}">${r.score}</span><div><b>${verdict}</b><div class="hint">70+ with no critical issues is required for approval.</div></div></div>
    ${r.issues.length ? `<ul class="issues">${r.issues.map(i => `<li data-sev="${i.sev}"><span class="sev">${i.sev}</span><span>${i.quote ? `<q>${esc(i.quote)}</q> · ` : ""}${esc(i.msg)}</span></li>`).join("")}</ul>` : `<p class="hint" style="margin-top:8px">No issues found by the rule check.</p>`}`;
}

/* ============================================================
   BRIEFS + PROMPTS
   ============================================================ */
function threadSteps(tid){
  return PIECES.filter(p => p.threads.some(([t]) => t === tid))
    .map(p => ({p, role:p.threads.find(([t]) => t === tid)[1]}))
    .sort((a,b) => a.p.wk - b.p.wk || CH_ORDER.indexOf(a.p.ch) - CH_ORDER.indexOf(b.p.ch));
}
function voiceBlock(chId){
  const c = CH[chId];
  return [
    `Sound like: ${VOICE.persona}`,
    `Dial for ${c.name}: warmth ${c.dial.warmth}/5 · wit ${c.dial.wit}/5 · depth ${c.dial.depth}/5`,
    `Limits: about ${c.limits.words} words per sentence · up to ${c.limits.emoji} emoji · up to ${c.limits.hashtags} hashtags · ${c.limits.bangs} exclamation mark${c.limits.bangs===1?"":"s"} max`,
    ...VOICE.pillars.map(p => `- ${p.name}: ${p.rule} Say "${p.say}" Not "${p.not}"`),
    `Words we use: ${VOICE.use.join(", ")}`,
    `Words we avoid: fix, cure, hack, crush it, self-care Sunday, just breathe, toxic, journey, game-changer, crazy/insane, good vibes, "you should"`,
  ].join("\n");
}
function buildBrief(p){
  const c = CH[p.ch], b = beatOf(p), prev = BEATS[p.wk-2], s = ps(p.id);
  const lines = [];
  lines.push(`LOW BATTERY · W${p.wk} "${b.title}" · ${c.name}`);
  lines.push(`Piece: ${p.title}`);
  lines.push(`Publishes ${fmt(publishDate(p))} · Draft due ${fmt(dueDate(p))} · Owner: ${ROLE[s.owner]?.name || s.owner}`);
  lines.push("", "OBJECTIVE");
  lines.push(`${c.role}. ${c.job}`);
  lines.push(`This week's beat (${b.act}): ${b.goal}`);
  lines.push("", "THE STORY SO FAR");
  lines.push(prev ? `Last week (W${prev.wk} "${prev.title}"): ${prev.summary}` : "This is the opening beat. Nobody knows the characters yet.");
  lines.push(`This week: ${b.summary}`);
  lines.push("", "THIS PIECE");
  lines.push(p.angle);
  lines.push(`Character focus: ${p.focus}`);
  lines.push(`Format: ${c.format}`);
  lines.push("", "CONTINUITY (keep these threads straight)");
  if (!p.threads.length) lines.push("No running threads in this piece. Echo the week's beat; don't advance a character arc or invent new story facts.");
  for (const [tid, role] of p.threads){
    const steps = threadSteps(tid), t = THREAD[tid];
    lines.push(`- ${t.name}: this piece is the ${role.toUpperCase()}. ${t.desc}`);
    for (const st of steps){
      if (st.p.id === p.id) continue;
      const when = st.p.wk < p.wk ? "Before" : st.p.wk > p.wk ? "After" : "Same week";
      lines.push(`    ${when}: ${label(st.p)} "${st.p.title}" (${st.role}) · ${STAGES[stageIdx(st.p.id)].name.toLowerCase()}`);
    }
  }
  lines.push("", "VOICE FOR THIS CHANNEL", voiceBlock(p.ch));
  lines.push("", "MANDATORIES");
  lines.push(`- CTA: ${p.cta}`);
  if (p.sensitive) lines.push("- SENSITIVE TOPIC: include the 988 Suicide & Crisis Lifeline (call or text 988, US) or the local equivalent. Clinical advisor must sign off.");
  if (p.ch === "cr") lines.push("- Disclosure: #ad or the Paid partnership label on every creator post.");
  lines.push("- No clinical claims, no promised outcomes, no streak shame.");
  lines.push("", "AI / HUMAN SPLIT");
  lines.push(`AI drafts: ${c.ai.join("; ")}.`);
  lines.push(`Human owns: ${c.human.join("; ")}.`);
  lines.push("", "MEASURE", c.kpi);
  lines.push("", "REVIEW CHECKLIST",
    "[ ] Consistent with the story so far (threads above)",
    "[ ] Voice check 70+ with no critical issues",
    "[ ] Clinical and safety sign-off",
    "[ ] CTA, links and accessibility (captions, alt text) checked");
  return lines.join("\n");
}
function draftPrompt(p){
  return [
    `You are writing a first draft for "Low Battery", a six-week transmedia campaign for Tend, a mental wellness app for Gen Z and Millennials. A human editor will rewrite, fact-check and approve everything you write, so give them strong raw material.`,
    "", "GUARDRAILS (non-negotiable)", ...VOICE.guardrails.map(g => "- " + g),
    "", "BRIEF", buildBrief(p),
    "", "DELIVERABLE", CH[p.ch].deliver,
    "", `Write plain text with short labels for each part. No preamble and no closing remarks. Stay consistent with the story so far and do not invent events that contradict it. Respect the voice limits for ${CH[p.ch].name}.`,
  ].join("\n");
}
function reviewPrompt(text, chId){
  return [
    `You are the voice editor for Tend, a mental wellness app. Review this ${CH[chId].name} draft against the voice bible and guardrails.`,
    "", "VOICE BIBLE", voiceBlock(chId),
    "", "GUARDRAILS", ...VOICE.guardrails.map(g => "- " + g),
    "", "DRAFT", text.slice(0, 12000),
    "", `Reply with only JSON: {"score": 0-100, "summary": "one sentence", "notes": [{"quote": "exact words from the draft", "issue": "what's off", "fix": "rewritten words"}]}. At most 6 notes, most important first. Judge tone and safety, not grammar.`,
  ].join("\n");
}

/* ============================================================
   STATE: shared db when available, otherwise this browser

const LS_KEY = "lowbattery.planner.v1";
function loadLocal(){
  try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v && typeof v === "object"){ state.pieces = v.pieces || {}; state.settings = {...state.settings, ...(v.settings || {})}; } } catch {}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({pieces:state.pieces, settings:state.settings})); } catch {} }

const writing = {}, queued = {};
async function persist(id){
  if (backend.kind !== "db"){ saveLocal(); return; }
  if (writing[id]){ queued[id] = true; return; }
  writing[id] = true;
  try {
    const ref = id === "__settings" ? backend.db.doc("settings/main") : backend.db.collection("pieces").doc(id);
    await ref.set(id === "__settings" ? {...state.settings} : {...state.pieces[id]});
  } catch (e){ dbError(e); }
  finally { writing[id] = false; if (queued[id]){ queued[id] = false; persist(id); } }
}
function dbError(e){
  const code = e && e.code;
  if (code === "invalid_argument"){ state.readOnly = true; renderAll(); refreshDrawer(); toast("You can view this plan, but your access doesn't allow changes."); }
  else if (code === "quota_exceeded") toast("The shared plan is full. Clear some old drafts and try again.");
  else if (code === "resource_exhausted") toast("Saving too fast. Your change will save on the next edit.");
  else toast("Couldn't save to the shared plan just now. Try that change again.");
}
function updatePiece(id, patch){
  if (state.readOnly) return;
  state.pieces[id] = {...ps(id), ...patch, updatedAt:Date.now()};
  persist(id); renderAll(); refreshDrawer();
}
function setLaunch(v){
  if (state.readOnly || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  state.settings.launch = v; persist("__settings"); renderAll();
}

async function connect(){
  const c = window.claude;
  if (!c || typeof c.use !== "function"){ setBackend("local"); setAI(null); return; }
  c.use("sample").then(setAI, () => setAI(null));
  const db = await c.use("db").catch(() => null);
  if (!db){ setBackend("local"); return; }
  backend.db = db; setBackend("db");
  db.collection("pieces").onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { if (PIECE[d.id]) next[d.id] = {...d.data()}; });
    for (const id in state.pieces) if (writing[id] && !next[id]) next[id] = state.pieces[id];
    state.pieces = next; renderAll(); refreshDrawer();
  }, () => { setBackend("local"); toast("Lost the connection to the shared plan. Changes now save in this browser."); });
  db.doc("settings/main").onSnapshot(d => {
    if (d.exists){ state.settings = {...state.settings, ...d.data()}; renderAll(); }
  }, () => {});
}
function setBackend(k){
  backend.kind = k; const el = $("#sync"); el.dataset.k = k;
  el.textContent = k === "db" ? "Shared with your team. Changes save for everyone." : "Saved in this browser only. Open it in Claude to share it with your team.";
}
function setAI(sample){
  ai.sample = sample || null; ai.status = sample ? "ready" : "off";
  $("#ai-status").textContent = sample ? "Claude drafting is on. Each draft uses your own Claude usage." : "Claude drafting is unavailable here. Use “Copy AI prompt” with your AI tool.";
  refreshDrawer(); if (tab === "voice") renderView();
}
const AI_ERR = {
  not_granted:"Claude isn't allowed for this page. Use “Copy AI prompt” instead.",
  sampling_disabled:"Claude isn't available for this account. Use “Copy AI prompt” instead.",
  rate_limited:"Claude is busy for you right now. Wait a minute, then try again.",
  session_expired:"Your session expired. Sign in again, then retry.",
  refused:"Claude declined this one. Adjust the brief and try again.",
  prompt_too_large:"The draft is too long to review. Trim it and retry.",

};
const aiErr = e => AI_ERR[e && e.code] || "Something interrupted Claude. Try again.";
function aiGone(e){ if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e && e.code)) setAI(null); }

/* ============================================================
   DERIVED NUMBERS
   ============================================================ */
function chargePct(){ return Math.round(PIECES.reduce((s,p) => s + stageIdx(p.id), 0) / (PIECES.length*5) * 100); }
function threadWarnings(){
  const out = [];
  for (const t of THREADS){
    const steps = threadSteps(t.id);
    steps.forEach((s, i) => {
      const si = stageIdx(s.p.id);
      if (si < STAGE_IDX.approved) return;
      const behind = steps.slice(0, i).filter(pr => pr.p.wk < s.p.wk && stageIdx(pr.p.id) < si);
      if (behind.length) out.push({t, msg:`${label(s.p)} "${s.p.title}" is ${STAGES[si].name.toLowerCase()}, but the earlier beat ${behind.map(b => `${label(b.p)} (${STAGES[stageIdx(b.p.id)].name.toLowerCase()})`).join(", ")} isn't. Audiences will meet the ${s.role} before the setup.`});
    });
    steps.filter(s => isLate(s.p.id)).forEach(s => out.push({t, msg:`${label(s.p)} "${s.p.title}" is overdue and carries the ${t.name} thread. A gap here breaks continuity for every later beat.`}));
  }
  return out;
}
function capacity(wk){
  const res = Object.fromEntries(ROLES.map(r => [r.id, {manual:0, ai:0}]));
  for (const p of PIECES.filter(p => p.wk === wk)){
    const c = CH[p.ch], o = res[ps(p.id).owner] ? ps(p.id).owner : c.owner;
    res[o].manual += c.hours.manual; res[o].ai += c.hours.ai;
    res.lead.manual += BRIEF_HOURS.manual; res.lead.ai += BRIEF_HOURS.ai;
    for (const r in REVIEW_HOURS){ res[r].manual += REVIEW_HOURS[r]; res[r].ai += REVIEW_HOURS[r]; }
  }
  return res;
}
function campaignWeek(){
  const d = Math.floor((today() - launchDate()) / 864e5);
  if (d < 0) return {pre:true, days:-d, wk:1};
  return {pre:false, wk:Math.min(6, Math.floor(d/7)+1), done:d >= 42};
}

function renderHeader(){
  const pct = chargePct();
  $("#charge-num").textContent = pct + "%";
  const f = $("#charge-fill"); f.style.width = Math.max(pct, 2) + "%";
  f.style.background = pct < 40 ? "var(--low)" : pct < 80 ? "var(--mid)" : "var(--accent)";
  const cw = campaignWeek();
  $("#charge-sub").textContent = cw.pre ? `Launches ${fmt(launchDate())} · ${cw.days} day${cw.days===1?"":"s"} to go` : cw.done ? "Campaign complete" : `Week ${cw.wk} of 6 is live`;
}
function renderAll(){ renderHeader(); renderView(); }
function renderView(){
  const v = $("#view");
  const keep = document.activeElement && v.contains(document.activeElement) && document.activeElement.id;
  if (tab === "voice" && $("#vc-text")){ renderVoiceResults(); return; } // don't wipe the checker while typing

  if (tab === "voice") renderVoiceResults();
  if (keep && document.getElementById(keep)) document.getElementById(keep).focus();
}

/* ---------- Story map ---------- */
function viewMap(){
  const live = PIECES.filter(p => ps(p.id).status === "live").length;
  const appr = PIECES.filter(p => ps(p.id).status === "approved").length;
  const prod = PIECES.filter(p => { const i = stageIdx(p.id); return i > 0 && i < STAGE_IDX.approved; }).length;
  const t0 = today(), soon = addDays(t0, 7);
  const dueSoon = PIECES.filter(p => stageIdx(p.id) < STAGE_IDX.approved && dueDate(p) >= t0 && dueDate(p) <= soon).length;
  const late = PIECES.filter(p => isLate(p.id)).length;
  const warns = threadWarnings(); const atRisk = new Set(warns.map(w => w.t.id)).size;
  const cw = campaignWeek(); const cap = capacity(cw.wk);
  const totM = Object.values(cap).reduce((s,x) => s + x.manual, 0), totA = Object.values(cap).reduce((s,x) => s + x.ai, 0);
  const totCap = ROLES.reduce((s,r) => s + r.cap, 0);
  const scored = PIECES.map(p => lintVoice(ps(p.id).draft, p.ch).score).filter(s => s != null);
  const avg = scored.length ? Math.round(scored.reduce((a,b) => a+b, 0) / scored.length) : null;

  const head = CHANNELS.map(c => {
    const ids = PIECES.filter(p => p.ch === c.id).map(p => p.id);
    const prog = Math.round(ids.reduce((s,id) => s + stageIdx(id), 0) / (ids.length*5) * 100);
    return `<th style="--ch:var(--ch-${c.id})"><div class="n"><span class="chdot"></span>${esc(c.name)}</div><div class="r">${esc(c.role)} · ${esc(c.format.split(" + ")[0])}</div><div class="prog" title="${prog}% through production"><span style="width:${prog}%"></span></div></th>`;
  }).join("");
  const rows = BEATS.map(b => `<tr><th class="beat"><div class="wk">W${b.wk} · ${esc(b.act)}</div><h3>${esc(b.title)}</h3><p>${esc(b.goal)}</p><p class="mono" style="margin-top:6px">${fmt(addDays(launchDate(), (b.wk-1)*7))}</p></th>${
    CHANNELS.map(c => { const p = PIECE[`w${b.wk}-${c.id}`]; return `<td class="map-td">${cellHTML(p)}</td>`; }).join("")}</tr>`).join("");

  return `
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Production</span><span class="v">${live} <small>live</small> · ${appr} <small>approved</small></span><span class="d">${prod} in production · ${PIECES.length - live - appr - prod} at brief</span></div>
    <div class="kpi ${late ? "warn" : ""}"><span class="eyebrow">Next 7 days</span><span class="v">${dueSoon} <small>drafts due</small></span><span class="d">${late ? `${late} overdue. Open the red cells.` : "Nothing overdue."}</span></div>
    <div class="kpi ${atRisk ? "warn" : ""}"><span class="eyebrow">Story continuity</span><span class="v">${THREADS.length - atRisk}<small>/${THREADS.length} threads on track</small></span><span class="d">${atRisk ? "See Story threads for what's out of order." : "Every setup lands before its payoff."}</span></div>
    <div class="kpi"><span class="eyebrow">Team load, week ${cw.wk}</span><span class="v">${h(totA)} <small>with AI</small></span><span class="d">vs ${h(totM)} without, against ${totCap}h of capacity</span></div>
    <div class="kpi"><span class="eyebrow">Voice consistency</span><span class="v">${avg ?? "–"}${avg != null ? "<small>/100 avg</small>" : ""}</span><span class="d">${scored.length ? `Across ${scored.length} draft${scored.length===1?"":"s"}` : "No drafts yet"}</span></div>
  </div>
  <div class="panel" style="display:grid;gap:14px">
    <div class="toolbar">
      <div><h2>One story, six channels</h2><p class="muted" style="font-size:14px">Each row is a week's beat. Each column is a channel with its own job in the story. Open any cell for its brief, draft and review.</p></div>
      <div class="row">
        <label class="field" for="f-launch">Launch date<input type="date" id="f-launch" value="${esc(state.settings.launch)}" ${state.readOnly?"disabled":""}></label>
        <label class="field" for="f-thread">Highlight thread<select id="f-thread"><option value="">All pieces</option>${THREADS.map(t => `<option value="${t.id}" ${mapThread===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select></label>
        <label class="field" for="f-role">Owner<select id="f-role"><option value="">Everyone</option>${ROLES.map(r => `<option value="${r.id}" ${mapRole===r.id?"selected":""}>${esc(r.name)}</option>`).join("")}</select></label>
      </div>
    </div>
    <div class="legend"><span>${batt(1)} Workflow charge: one bar per stage</span><span>○ setup · ◐ develop · ● payoff</span></div>
    <div class="scroll-x" style="padding:6px"><table class="map"><thead><tr><th style="width:190px"><span class="eyebrow">Week / beat</span></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}
function cellHTML(p){
  const s = ps(p.id);
  const dim = (mapThread && !p.threads.some(([t]) => t === mapThread)) || (mapRole && s.owner !== mapRole);

      <div class="bars">

  }).join("");
  return `
  <div class="panel" style="display:grid;gap:14px">
    <div class="toolbar"><div><h2>AI drafts. Humans decide.</h2><p class="muted" style="font-size:14px;max-width:80ch">Claude does the blank-page work: first drafts, variants, captions. People do what makes the story true: lived detail, performance, clinical judgment and the final call. Nothing reaches Approved without a voice score of 70+ and clinical sign-off, and editing an approved piece sends it back to Review.</p></div>

    <div class="scroll-x"><div class="board">${cols}</div></div>
  </div>
  <div class="panel cap">
    <div class="toolbar"><div><h2>Can a small team ship this?</h2><p class="muted" style="font-size:14px;max-width:75ch">Weekly hours by role for six pieces, counting briefs, production and review. Change who owns a piece in its drawer and this updates.</p></div>
      <label class="field" for="f-capweek">Week<select id="f-capweek">${BEATS.map(b => `<option value="${b.wk}" ${capWeek===b.wk?"selected":""}>W${b.wk} · ${esc(b.title)}</option>`).join("")}</select></label></div>
    <div class="legend"><span><i style="background:var(--muted);opacity:.55"></i>Without AI</span><span><i style="background:var(--accent)"></i>With AI drafting</span><span><i style="background:var(--low)"></i>Over capacity</span><span><i style="background:var(--ink);width:2px"></i>Weekly capacity</span></div>
    ${capRows}
  </div>`;
}
function cardHTML(p, i){
  const next = i < STAGES.length - 1 ? gate(p.id, i+1) : "end";
  return `<article class="card" style="--ch:var(--ch-${p.ch})">
    <button class="t" data-piece="${p.id}">${esc(p.title)}</button>
    <div class="m"><span>${esc(label(p))} · due ${fmt(dueDate(p))}</span>${isLate(p.id) ? `<span class="pill late">Overdue</span>` : ""}</div>
    <div class="m"><span>${esc(ROLE[ps(p.id).owner]?.name || "")}</span>
      <span class="mv">${i > 0 ? `<button class="btn sm" data-move="${p.id}" data-to="${i-1}" ${state.readOnly?"disabled":""} aria-label="Move back to ${esc(STAGES[i-1].name)}">←</button>` : ""}${i < STAGES.length-1 ? `<button class="btn sm" data-move="${p.id}" data-to="${i+1}" ${next || state.readOnly ? "disabled" : ""} aria-label="Move to ${esc(STAGES[i+1].name)}">→</button>` : ""}</span></div>
    ${next && next !== "end" ? `<span class="why">${esc(next)}</span>` : ""}
  </article>`;
}
function gate(id, toIdx){
  const s = ps(id), cur = stageIdx(id);
  if (toIdx <= cur) return null;
  if (toIdx > cur + 1) return "Move one stage at a time.";
  const to = STAGES[toIdx].id;
  if ((to === "edit" || to === "review") && !s.draft.trim()) return "Needs a draft first.";
  if (to === "approved"){
    const r = lintVoice(s.draft, PIECE[id].ch);
    if (r.critical) return "Fix critical voice or safety issues first.";
    if (r.score < 70) return `Voice score is ${r.score}; it needs 70+.`;
    if (!s.safetyOk) return "Needs clinical and safety sign-off.";
  }
  return null;
}
function moveTo(id, toIdx){
  const why = gate(id, toIdx);
  if (why){ toast(why); return; }
  const patch = {status:STAGES[toIdx].id};
  if (toIdx < STAGE_IDX.review) patch.safetyOk = false;
  updatePiece(id, patch);
}

  $("#d-brief").textContent = buildBrief(p);
  const ta = $("#d-draft");
  if (document.activeElement !== ta && !drafting && ta.value !== (s.draft || "")) ta.value = s.draft || "";
  ta.readOnly = ro || drafting;
  const nt = $("#d-notes");
  if (document.activeElement !== nt && nt.value !== (s.notes || "")) nt.value = s.notes || "";
  nt.readOnly = ro;
  $("#d-ai").hidden = !ai.sample || drafting; $("#d-ai").disabled = ro; $("#d-stop").hidden = !drafting;
  $("#d-review").hidden = !ai.sample;
  if (!drafting) $("#d-ai-note").textContent = ai.sample
    ? "Claude writes a first draft from the brief above. It's a starting point for a person, never a final."
    : ai.status === "checking" ? "Checking whether Claude is available…" : "Claude isn't available in this view. Copy the AI prompt into your AI tool, then paste the result below.";
  $("#d-lint").innerHTML = lintHTML(lintVoice(ta.value, p.ch));
  $("#d-ai-review").innerHTML = reviews[id] ? aiReviewHTML(reviews[id]) : "";
  const sc = $("#d-safety"); sc.checked = !!s.safetyOk;
  sc.disabled = ro || i !== STAGE_IDX.review;
  $("#d-safety-hint").textContent = i < STAGE_IDX.review ? "Unlocks when the piece reaches Review." : i > STAGE_IDX.review ? "Signed off. Editing the draft now sends it back to Review." : "";
}
function onDraftInput(){
  const id = openId; if (!id) return;
  $("#d-lint").innerHTML = lintHTML(lintVoice($("#d-draft").value, PIECE[id].ch));
  clearTimeout(saveTimer); saveTimer = setTimeout(flushDraft, 900);
}
function flushDraft(){
  clearTimeout(saveTimer); const id = openId; if (!id || state.readOnly || drafting) return;
  const v = $("#d-draft").value, s = ps(id); if (v === (s.draft || "")) return;
  const patch = {draft:v}, i = stageIdx(id);
  if (s.status === "draft" && v.trim()) patch.status = "edit";
  if (i >= STAGE_IDX.approved){ patch.status = "review"; patch.safetyOk = false; toast("Edited after approval, so it's back in Review."); }
  if (s.status === "brief" && v.trim()) patch.status = "draft";
  updatePiece(id, patch);
}
async function draftWithClaude(){
  const id = openId; if (!ai.sample || !id || state.readOnly) return;
  const p = PIECE[id], ta = $("#d-draft");
  if (ta.value.trim() && !$("#d-ai").dataset.confirm){
    $("#d-ai").dataset.confirm = "1"; $("#d-ai").textContent = "Replace current draft?";
    setTimeout(() => { const b = $("#d-ai"); if (b){ delete b.dataset.confirm; b.textContent = "Draft with Claude"; } }, 4000);
    return;
  }
  $("#d-ai").textContent = "Draft with Claude"; delete $("#d-ai").dataset.confirm;
  draftCtl = new AbortController(); drafting = true; refreshDrawer();
  $("#d-ai-note").textContent = "Thinking… Claude reads the brief, the story so far and the voice rules first.";
  const before = ta.value;
  try {
    const {text, truncated} = await ai.sample(draftPrompt(p), {signal:draftCtl.signal, cache:false,
      onText:({text}) => { if (openId === id){ ta.value = text; $("#d-ai-note").textContent = "Writing…"; } }});
    drafting = false;
    // A fresh AI draft restarts human editing: anything past First draft goes back to Human edit.
    const patch = {draft:text, status:stageIdx(id) <= STAGE_IDX.draft ? "draft" : "edit"};
    if (stageIdx(id) >= STAGE_IDX.review) patch.safetyOk = false;
    updatePiece(id, patch);
    if (openId === id) $("#d-ai-note").textContent = truncated ? "Claude's draft was cut short. Ask for less, or edit from here." : "First draft in. Now make it yours: edit, add lived detail, cut what doesn't sound like a person.";
  } catch (e){
    drafting = false;
    if (openId === id){
      ta.value = e && e.text ? e.text : before;
      if (e && e.code !== "cancelled") $("#d-ai-note").textContent = aiErr(e);
      else $("#d-ai-note").textContent = "Stopped.";
      if (e && e.text) updatePiece(id, {draft:e.text, status:stageIdx(id) <= STAGE_IDX.draft ? "draft" : ps(id).status});
    }
    aiGone(e); refreshDrawer();
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
function setTab(t, push){
  tab = t;
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  $("#view").innerHTML = ""; renderView();
  if (push){ try { history.replaceState(null, "", "#" + t); } catch {} }
  try { localStorage.setItem(LS_KEY + ".tab", t); } catch {}
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t){ setTab(t.dataset.tab, true); return; }
  const mv = e.target.closest("[data-move]"); if (mv){ moveTo(mv.dataset.move, +mv.dataset.to); return; }
  const pc = e.target.closest("[data-piece]"); if (pc){ openDrawer(pc.dataset.piece); return; }
  if (e.target.closest(".dclose") || e.target.id === "scrim"){ closeDrawer(); return; }
  const id = e.target.closest("button")?.id;
  if (id === "d-copy-brief") copy(buildBrief(PIECE[openId]), e.target);
  else if (id === "d-copy-prompt") copy(draftPrompt(PIECE[openId]), e.target);
  else if (id === "d-ai") draftWithClaude();
  else if (id === "d-stop") draftCtl?.abort();
  else if (id === "d-review"){ const pid = openId; askClaudeReview($("#d-draft").value, PIECE[pid].ch, r => { reviews[pid] = r; }, () => { if (openId === pid) $("#d-ai-review").innerHTML = aiReviewHTML(reviews[pid]); }); }
  else if (id === "vc-ai") askClaudeReview(vcText, vcCh, r => { vcAI = r; }, renderVoiceResults);
  else if (id === "vc-clear"){ vcText = ""; vcAI = null; $("#vc-text").value = ""; renderVoiceResults(); $("#vc-text").focus(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "f-thread"){ mapThread = e.target.value; renderView(); }
  else if (id === "f-role"){ mapRole = e.target.value; renderView(); }
  else if (id === "f-launch") setLaunch(e.target.value);
  else if (id === "f-week"){ flowWeek = e.target.value; renderView(); }
  else if (id === "f-capweek"){ capWeek = +e.target.value; renderView(); }
  else if (id === "vc-ch"){ vcCh = e.target.value; vcAI = null; renderVoiceResults(); }
  else if (id === "d-status"){ flushDraft(); moveTo(openId, +e.target.value); refreshDrawer(); }
  else if (id === "d-owner") updatePiece(openId, {owner:e.target.value});
  else if (id === "d-safety"){ if (e.target.checked && !$("#d-draft").value.trim()){ e.target.checked = false; return; } updatePiece(openId, {safetyOk:e.target.checked}); }
  else if (id === "d-notes") updatePiece(openId, {notes:e.target.value.slice(0, 4000)});
});
document.addEventListener("input", e => {
  if (e.target.id === "d-draft") onDraftInput();
  else if (e.target.id === "vc-text"){ vcText = e.target.value; vcAI = null; renderVoiceResults(); }
});
document.addEventListener("focusout", e => { if (e.target.id === "d-draft") flushDraft(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && openId) closeDrawer();
  if (e.key === "Tab" && openId){
    const f = [...$("#drawer").querySelectorAll("button:not([hidden]):not([disabled]),select:not([disabled]),textarea,input:not([disabled])")].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

/* ============================================================
   BOOT
   ============================================================ */
loadLocal();
capWeek = campaignWeek().wk;
flowWeek = String(capWeek);
{
  let start = (location.hash || "").slice(1);
  if (!["map","threads","workflow","voice","plan"].includes(start)){ try { start = localStorage.getItem(LS_KEY + ".tab") || "map"; } catch { start = "map"; } }
  if (!["map","threads","workflow","voice","plan"].includes(start)) start = "map";
  setTab(start, false);
}
renderHeader();
connect();
</script>
